<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중1 수학 용어 사전</title>
  <meta name="description" content="중학교 1학년 수학 교과서에 등장하는 새 용어를 단원별로 정리한 사전입니다." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="page-header">
    <h1 class="page-title">중1 수학 용어 사전</h1>
    <p class="page-subtitle">교과서에 새롭게 등장하는 용어를 단원별로 정리했습니다</p>
  </header>

  <main class="page-body">

    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6.5" cy="6.5" r="4.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input
        type="search"
        id="search"
        placeholder="용어, 설명으로 검색..."
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs"></div>

    <!-- Stats -->
    <p class="stats-bar" id="stats"></p>

    <!-- Cards -->
    <div class="grid" id="grid"></div>

  </main>

  <footer class="page-footer">
    중학교 1학년 수학 교과서 (Ⅰ. 수와 연산 / Ⅱ. 방정식) 기반
  </footer>

  <!-- Data first, then app logic -->
  <script src="data/terms.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
