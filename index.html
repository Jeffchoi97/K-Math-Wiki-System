<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-Math Wiki — 한국 수학 교육과정 용어 사전</title>
  <meta name="description" content="중·고등학교 수학 교육과정 용어를 단원별로 정리한 위키" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="page-header">
    <h1 class="page-title">K-Math Wiki</h1>
    <p class="page-subtitle">중·고등학교 수학 교육과정 용어 사전</p>
  </header>

  <main class="page-body">

    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6.5" cy="6.5" r="4.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input
        type="search"
        id="search"
        placeholder="용어, 정의, 예시로 검색…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Level 1: 학교급 -->
    <div class="nav-section">
      <p class="nav-label">학교급</p>
      <div class="school-toggle" id="school-toggle"></div>
    </div>

    <!-- Level 2: 과목 -->
    <div class="nav-section">
      <p class="nav-label">과목</p>
      <div class="subject-tabs" id="subject-tabs"></div>
    </div>

    <!-- Level 3: 단원 -->
    <div class="nav-section">
      <p class="nav-label">단원</p>
      <div class="chapter-tabs" id="chapter-tabs"></div>
    </div>

    <!-- Stats -->
    <p class="stats-bar" id="stats"></p>

    <!-- Content -->
    <div id="content"></div>

  </main>

  <footer class="page-footer">
    <p>한국 중·고등학교 수학 교육과정 기반 · 
       <a href="https://github.com/Jeffchoi97/K-Math-Wiki-System">GitHub</a></p>
  </footer>

  <!-- Data first, then app logic -->
  <script src="data/curriculum.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
